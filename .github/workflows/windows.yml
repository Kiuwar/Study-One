name: Windows (.exe e instalador)

on:
  push:
    branches: ['claude/**', 'main']
    tags: ['v*']
    paths: ['pausa_de_estudo/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pausa_de_estudo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testes da lógica
        run: python -m unittest discover -s testes

      - name: Conferir versão (a tag vX.Y.Z precisa ser igual a versao.py)
        id: versao
        shell: pwsh
        run: |
          $v = python -c "import versao; print(versao.VERSAO)"
          "Versao do app: $v"
          "v=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "A tag $env:GITHUB_REF_NAME nao bate com versao.py (v$v)"
          }

      - name: Gerar o .exe (PyInstaller)
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --noconsole --onedir --noconfirm --name PausaDeEstudo --icon icone.ico main.py

      - name: Teste de fumaça do .exe (abre o painel, 2ª abertura, encerra)
        shell: pwsh
        run: |
          $exe = "dist\PausaDeEstudo\PausaDeEstudo.exe"
          Start-Process $exe                         # duplo clique: abre o painel
          Start-Sleep -Seconds 6
          $p = Get-Process PausaDeEstudo -ErrorAction SilentlyContinue
          if (-not $p) { throw "O app nao ficou rodando"; }
          "Janela do painel: '" + ($p | Select-Object -First 1).MainWindowTitle + "'"
          if (-not (Test-Path "dist\PausaDeEstudo\config.json")) { throw "config.json nao foi criado" }
          if (Test-Path "dist\PausaDeEstudo\erros.log") { Get-Content "dist\PausaDeEstudo\erros.log"; throw "erros.log foi criado" }
          Start-Process $exe -Wait                   # 2ª abertura: so repassa o comando e sai
          if (@(Get-Process PausaDeEstudo).Count -ne 1) { throw "Abriu uma segunda instancia" }
          & $exe --sair
          Start-Sleep -Seconds 4
          if (Get-Process PausaDeEstudo -ErrorAction SilentlyContinue) { throw "--sair nao encerrou o app" }
          Remove-Item "dist\PausaDeEstudo\config.json" -Force -ErrorAction SilentlyContinue

      - name: Gerar o instalador (Inno Setup)
        shell: pwsh
        run: |
          $versao = python -c "import versao; print(versao.VERSAO)"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$versao" instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar o instalador" }

      - name: Versão portátil (.zip) e checksum do instalador
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\PausaDeEstudo\*" -DestinationPath "installer\PausaDeEstudo-portatil.zip"
          $h = (Get-FileHash "installer\PausaDeEstudo-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  PausaDeEstudo-Setup.exe" | Out-File "installer\PausaDeEstudo-Setup.exe.sha256" -Encoding ascii
          Get-Content "installer\PausaDeEstudo-Setup.exe.sha256"

      - name: Notas da versão (do CHANGELOG.md)
        run: python -c "import re,versao;t=open('CHANGELOG.md',encoding='utf-8').read();m=re.search(r'## %s\n(.*?)(?=\n## |\Z)'%re.escape(versao.VERSAO),t,re.S);open('notas.md','w',encoding='utf-8').write(m.group(1).strip() if m else 'Veja o CHANGELOG.')"

      - uses: actions/upload-artifact@v4
        with:
          name: PausaDeEstudo-Windows
          path: |
            pausa_de_estudo/installer/PausaDeEstudo-Setup.exe
            pausa_de_estudo/installer/PausaDeEstudo-Setup.exe.sha256
            pausa_de_estudo/installer/PausaDeEstudo-portatil.zip

      # Em tag vX.Y.Z ou em push na main: publica a release v<versao.py> (cria a tag se faltar).
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          target_commitish: ${{ github.sha }}
          body_path: pausa_de_estudo/notas.md
          files: |
            pausa_de_estudo/installer/PausaDeEstudo-Setup.exe
            pausa_de_estudo/installer/PausaDeEstudo-Setup.exe.sha256
            pausa_de_estudo/installer/PausaDeEstudo-portatil.zip
